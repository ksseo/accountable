# Alembic's settings, for running migrations by hand:
#   uv run alembic -c backend/alembic.ini upgrade head
#   uv run alembic -c backend/alembic.ini revision -m "..."
# The app runs them itself on start. The database file comes from
# ACCOUNTABLE_DB, as in the app (backend/data/accountable.db by default).

[alembic]
script_location = %(here)s/accountable/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
