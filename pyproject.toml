[project]
name = "accountable"
version = "0.1.0"
description = "Accountable: a sales CRM for one person, growing into a business OS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend"
module-name = "accountable"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 110
src = ["backend"]

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.109",
]
