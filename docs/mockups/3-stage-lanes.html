<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accountable mockup 3: Stage lanes</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  /* Mockup 3, Stage lanes: the open pipeline as one long band of stage colors, and a board of tinted lanes. */
  .shell { max-width: 1440px; margin: 0 auto; padding: 22px 48px 64px; }

  .top { display: flex; align-items: center; gap: 40px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 22px; letter-spacing: -0.01em; line-height: 1; }
  .nav { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #E3EAEC; }
  .nav a { display: flex; align-items: center; height: 38px; padding: 0 16px; border-radius: 10px; font-weight: 500; color: var(--muted); }
  .nav a:hover { color: var(--midnight); }
  .nav a.is-current { background: var(--panel); color: var(--midnight); font-weight: 600; }
  .top-actions { margin-left: auto; display: flex; gap: 8px; }

  .btn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 12px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .btn-dark { background: var(--midnight); color: #fff; }
  .btn-white { background: var(--panel); color: var(--midnight); }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin: 40px 0 22px; }
  .page-head h1 { font-size: 32px; font-weight: 700; line-height: 1.15; letter-spacing: -0.015em; }
  .page-head p { margin-top: 6px; color: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 22px; }
  .span-5 { grid-column: span 5; } .span-7 { grid-column: span 7; } .span-12 { grid-column: span 12; }

  .panel { background: var(--panel); border-radius: 26px; padding: 26px 28px; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .panel-head h2 { font-size: 17px; font-weight: 600; }
  .panel-head .sub { font-size: 13.5px; color: var(--muted); }
  .panel-head .sub b { color: var(--midnight); font-weight: 600; }

  .chart { display: block; width: 100%; height: auto; }
  .chart .axis { font: 500 11.5px var(--font-sans); fill: var(--muted); }
  .chart .bar-label { font: 600 11px var(--font-sans); fill: var(--midnight); }
  .chart .point-label { font: 600 13px var(--font-sans); fill: var(--midnight); }

  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* Hero: the open pipeline as a band */
  .hero { padding: 30px 32px 30px; }
  .figs { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 24px; }
  .fig-label { font-size: 14px; color: var(--muted); font-weight: 500; }
  .fig-value { font-weight: 600; font-size: 28px; letter-spacing: -0.03em; margin-top: 2px; }
  .fig-main .fig-value { font-size: 40px; }
  .fig-sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .fig-sub .up { color: var(--sea-green-ink); font-weight: 600; }
  .fig-late .fig-value, .fig-late .fig-sub b { color: var(--raspberry-ink); }
  .fig-late .fig-sub b { font-weight: 600; }

  .band { display: flex; gap: 4px; margin-top: 30px; }
  .band-seg { min-width: 0; }
  .band-block { height: 84px; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; }
  .band-block .name { font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
  .band-block .name span { font-weight: 500; font-size: 12.5px; }
  .band-block .val { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  .band-exp { height: 12px; border-radius: 6px; background: #E3EAEC; margin-top: 8px; overflow: hidden; }
  .band-exp span { display: block; height: 100%; border-radius: 6px; }
  .band-exp-label { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .band-exp-label b { font-weight: 500; color: var(--midnight); }
  .band-key { display: flex; gap: 20px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .band-key i { display: inline-block; width: 22px; height: 10px; border-radius: 5px; margin-right: 8px; vertical-align: -1px; }

  /* Funnel */
  .funnel-svg { display: block; width: 100%; height: auto; }
  .funnel-svg .seg-name { font: 700 13.5px var(--font-sans); }
  .funnel-svg .num { font: 600 14px var(--font-sans); fill: var(--midnight); }
  .funnel-svg .num-sub { font: 400 12px var(--font-sans); fill: var(--muted); }
  .funnel-foot { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; font-size: 13.5px; color: var(--muted); }
  .funnel-foot b { font-size: 20px; color: var(--midnight); }

  /* Follow-ups */
  .todo { display: grid; gap: 8px; }
  .todo li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 16px; border-radius: 14px; background: var(--page); }
  .todo .what { font-weight: 500; }
  .todo .on { display: inline; margin-left: 10px; font-size: 13px; color: var(--muted); }
  .todo .check { margin-top: 0; }
  .todo .on a { color: var(--cerulean-ink); font-weight: 500; }
  .when { font-size: 13px; font-weight: 600; white-space: nowrap; padding-top: 1px; }
  .when.overdue { color: var(--raspberry-ink); }
  .when.today { color: var(--sea-green-ink); }
  .when.upcoming { color: var(--muted); font-weight: 500; }
  .todo-foot { margin-top: 12px; font-size: 13.5px; color: var(--muted); }

  /* Recent activity */
  .feed { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 40px; }
  .feed li { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: start; }
  .feed .badge { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--page); }
  .feed .badge .icon { width: 16px; height: 16px; }
  .feed .text { font-size: 14px; line-height: 1.45; }
  .feed .on { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .feed .on a { color: var(--cerulean-ink); font-weight: 500; }
  .feed .at { font-size: 12.5px; color: var(--muted); white-space: nowrap; }

  /* Pipeline board */
  .board-band { display: flex; gap: 3px; margin-bottom: 8px; }
  .board-band span { height: 10px; border-radius: 5px; }
  .board-key { display: flex; gap: 3px; font-size: 12.5px; color: var(--muted); margin-bottom: 22px; }
  .board { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .lane { border-radius: 22px; padding: 14px 12px 12px; }
  .lane-head { padding: 2px 4px 12px; }
  .lane-title { display: flex; align-items: center; justify-content: space-between; }
  .lane-title h2 { font-size: 16px; font-weight: 700; }
  .lane-count { font-size: 12.5px; font-weight: 600; background: var(--panel); border-radius: 999px; padding: 2px 9px; }
  .lane-total { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin-top: 8px; }
  .lane-exp { font-size: 12.5px; color: var(--muted); }
  .lane-exp b { font-weight: 500; color: var(--midnight); }
  .lane-share { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.85); margin-top: 10px; overflow: hidden; }
  .lane-share span { display: block; height: 100%; border-radius: 3px; }
  .lane-add { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 34px; border-radius: 10px; background: rgba(255, 255, 255, 0.7); font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .lane-add .icon { width: 15px; height: 15px; }
  .cards { display: grid; gap: 8px; }
  .card { background: var(--panel); border-radius: 14px; padding: 12px 14px; position: relative; }
  .card-late { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--raspberry-ink); color: #fff; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  .card-name { font-size: 14px; font-weight: 600; line-height: 1.35; padding-right: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-org { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .card-value { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; margin-top: 10px; }
  .card-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 2px; font-size: 12.5px; color: var(--muted); }
  .card-foot .prob { font-size: 12px; }
  .card-foot.late { color: var(--raspberry-ink); font-weight: 500; }
  .card-menu { position: absolute; top: 9px; right: 7px; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
  .card-menu .icon { width: 15px; height: 15px; }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="#dashboard" aria-label="Accountable 대시보드">
      <svg width="34" height="14" viewBox="0 0 34 14" aria-hidden="true"><rect x="0" y="0" width="12" height="14" rx="4" fill="#06D6A0"/><rect x="14" y="0" width="9" height="14" rx="4" fill="#FFC145"/><rect x="25" y="0" width="5" height="14" rx="2.5" fill="#F78C6B"/><rect x="31.5" y="0" width="2.5" height="14" rx="1.25" fill="#118AB2"/></svg>
      Accountable
    </a>
    <nav class="nav" aria-label="주 메뉴" id="nav"></nav>
    <div class="top-actions" id="top-actions"></div>
  </header>

  <main>
    <section data-view="dashboard" id="dashboard"></section>
    <section data-view="pipeline" id="pipeline" hidden></section>
  </main>
</div>

<script src="shared.js"></script>
<script>
  document.getElementById('nav').innerHTML = NAV.map((n) =>
    `<a href="${navHref(n.key)}" data-nav="${n.key}">${n.ko}</a>`).join('');
  document.getElementById('top-actions').innerHTML =
    `<button class="btn btn-dark" type="button">${icon('plus')}영업 기회 추가</button>`;

  const chipStyle = (s) => `background:${s.chip};color:${s.onChip}`;

  function funnelSvg() {
    const W = 520, segH = 58, gap = 5, fw = 300, cx = fw / 2;
    const max = FUNNEL[0].value;
    const widths = FUNNEL.map((f) => Math.max(0.28, f.value / max) * fw);
    const H = FUNNEL.length * (segH + gap);
    const segs = FUNNEL.map((f, i) => {
      const s = STAGE[f.stage];
      const top = widths[i];
      const bottom = i < FUNNEL.length - 1 ? widths[i + 1] : widths[i] * 0.86;
      const y = i * (segH + gap);
      const pts = [[cx - top / 2, y], [cx + top / 2, y], [cx + bottom / 2, y + segH], [cx - bottom / 2, y + segH]];
      return `
        <path d="M ${pts.map((p) => p.map(f1).join(' ')).join(' L ')} Z" fill="${s.chip}" stroke-linejoin="round"/>
        <text x="${cx}" y="${y + segH / 2 + 5}" text-anchor="middle" class="seg-name" fill="${s.onChip}">${s.ko}</text>
        <text x="${fw + 28}" y="${y + 25}" class="num">${usd(f.value)}</text>
        <text x="${fw + 28}" y="${y + 43}" class="num-sub">${f.n}건, 신규의 ${pct((f.value / max) * 100)}</text>`;
    }).join('');
    const summary = FUNNEL.map((f) => `${STAGE[f.stage].ko} ${usd(f.value)}`).join(', ');
    return `<svg class="funnel-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="영업 퍼널: ${summary}">${segs}</svg>`;
  }

  // Dashboard
  document.getElementById('dashboard').innerHTML = `
    <div class="page-head">
      <div>
        <h1>대시보드</h1>
        <p>${fmtDateDow(TODAY)}. 기한 지난 후속 조치 ${FIG.overdueCount}건과 지연된 영업 기회 ${FIG.lateCount}건이 있어요.</p>
      </div>
      <button class="btn btn-white" type="button">${icon('note')}활동 기록</button>
    </div>

    <div class="grid">
      <section class="panel hero span-12" aria-label="진행 중 파이프라인">
        <div class="figs">
          <div class="fig-main">
            <p class="fig-label">진행 중 파이프라인</p>
            <p class="fig-value">${usd(FIG.openValue)}</p>
            <p class="fig-sub">영업 기회 ${FIG.openCount}건</p>
          </div>
          <div>
            <p class="fig-label">예상 매출</p>
            <p class="fig-value">${usd(FIG.expected)}</p>
            <p class="fig-sub">파이프라인의 ${pct(FIG.expectedShare)}</p>
          </div>
          <div>
            <p class="fig-label">이번 달 수주</p>
            <p class="fig-value">${usd(FIG.wonMonth)}</p>
            <p class="fig-sub">지난달보다 <span class="up">${pct(FIG.wonChangePct)} 증가</span></p>
          </div>
          <a class="fig-late" href="#">
            <p class="fig-label">지연된 영업 기회</p>
            <p class="fig-value">${FIG.lateCount}건</p>
            <p class="fig-sub">모두 <b>${usd(FIG.lateValue)}</b></p>
          </a>
        </div>

        <div class="band">
          ${OPEN_STAGES.map((s) => `
            <a class="band-seg" href="#pipeline" style="flex:${s.value}">
              <div class="band-block" style="${chipStyle(s)}">
                <p class="name">${s.ko}<span>${s.count}건</span></p>
                <p class="val">${usd(s.value)}</p>
              </div>
              <div class="band-exp"><span style="width:${s.prob}%;background:${s.fill}"></span></div>
              <p class="band-exp-label">예상 <b>${usd(s.expected)}</b></p>
            </a>`).join('')}
        </div>
        <p class="band-key"><span>칸의 너비는 단계별 금액, 아래 막대는 그중 예상 매출의 비율이에요.</span></p>
      </section>

      <section class="panel span-7">
        <div class="panel-head"><h2>월별 수주 금액</h2><span class="sub">최근 12개월 <b>${usd(FIG.wonYear)}</b></span></div>
        ${lineChart({ width: 720, height: 280 })}
      </section>

      <section class="panel span-5">
        <div class="panel-head">
          <h2>월별 수주·실주 건수</h2>
          <div class="legend"><span><i style="background:#06D6A0"></i>수주</span><span><i style="background:#F78C6B"></i>실주</span></div>
        </div>
        ${barChart({ width: 500, height: 300 })}
      </section>

      <section class="panel span-5">
        <div class="panel-head"><h2>영업 퍼널</h2><span class="sub">최근 12개월</span></div>
        ${funnelSvg()}
        <p class="funnel-foot">신규 → 수주 전환율 (금액 기준)<b>${pct((FUNNEL[4].value / FUNNEL[0].value) * 100)}</b></p>
      </section>

      <section class="panel span-7">
        <div class="panel-head"><h2>후속 조치</h2><span class="sub">기한 지남 ${FIG.overdueCount}건, 오늘 1건</span></div>
        <ul class="todo">
          ${FOLLOWUPS.map((f, i) => {
            const st = followUpState(f);
            return `<li>
              <input class="check" type="checkbox" id="fu${i}">
              <div><label class="what" for="fu${i}">${f.text}</label><span class="on"><a href="#">${f.on}</a>${f.sub ? `, ${f.sub}` : ''}</span></div>
              <span class="when ${st.kind}">${st.label}</span>
            </li>`;
          }).join('')}
        </ul>
        <p class="todo-foot">그 이후 ${FOLLOWUPS_LATER}건 더 있어요.</p>
      </section>

      <section class="panel span-12">
        <div class="panel-head"><h2>최근 활동</h2></div>
        <ul class="feed">
          ${ACTIVITY.map((a) => `<li>
            <span class="badge" title="${KIND_LABEL[a.kind]}">${icon(a.kind)}</span>
            <div><p class="text">${a.text}</p><p class="on"><span class="sr-only">${KIND_LABEL[a.kind]}, </span><a href="#">${a.on}</a>${a.sub ? `, ${a.sub}` : ''}</p></div>
            <span class="at">${fmtWhen(a.at)}</span>
          </li>`).join('')}
        </ul>
      </section>
    </div>`;

  // Pipeline
  const card = (d) => `
    <article class="card" tabindex="0" aria-label="${d.name}, ${usd(d.value)}">
      ${isLate(d) ? `<p class="card-late">${icon('clock')}지연 ${daysLate(d)}일</p>` : ''}
      <h3 class="card-name">${d.name}</h3>
      <p class="card-org">${d.org}</p>
      <button class="card-menu" type="button" aria-label="${d.name} 메뉴">${icon('more')}</button>
      <p class="card-value">${usd(d.value)}</p>
      <p class="card-foot ${isLate(d) ? 'late' : ''}"><span>${fmtDate(d.close)}</span><span class="prob">${d.prob}%</span></p>
    </article>`;

  document.getElementById('pipeline').innerHTML = `
    <div class="page-head">
      <div>
        <h1>파이프라인</h1>
        <p>진행 중 ${usd(FIG.openValue)}, 예상 매출 ${usd(FIG.expected)}. 카드를 끌어 단계를 바꾸세요.</p>
      </div>
    </div>
    <div class="board-band" role="img" aria-label="${OPEN_STAGES.map((s) => `${s.ko} ${usd(s.value)}`).join(', ')}">
      ${OPEN_STAGES.map((s) => `<span style="flex:${s.value};background:${s.fill}"></span>`).join('')}
    </div>
    <div class="board-key">
      ${OPEN_STAGES.map((s) => `<span style="flex:${s.value}">${s.ko} ${pct((s.value / FIG.openValue) * 100)}</span>`).join('')}
    </div>
    <div class="board">
      ${BY_STAGE.map((s) => `
        <section class="lane" style="background:${s.tint}" aria-labelledby="lane-${s.key}">
          <div class="lane-head">
            <div class="lane-title"><h2 id="lane-${s.key}" style="color:${s.ink}">${s.ko}</h2><span class="lane-count">${s.count}</span></div>
            <p class="lane-total">${usd(s.value)}</p>
            <p class="lane-exp">${s.open ? `예상 <b>${usd(s.expected)}</b>` : '최근 30일'}</p>
            ${s.open ? `<div class="lane-share" aria-hidden="true"><span style="width:${(s.value / FIG.openValue) * 100}%;background:${s.fill}"></span></div>` : ''}
          </div>
          <button class="lane-add" type="button" aria-label="${s.ko} 단계에 영업 기회 추가">${icon('plus')}추가</button>
          <div class="cards">${s.deals.map(card).join('')}</div>
        </section>`).join('')}
    </div>`;

  setupViews();
</script>
</body>
</html>
