<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accountable mockup 1: Open ledger</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  /* Mockup 1, Open ledger: a floating pill bar, lots of air, and the revenue line as the hero. */
  .shell { max-width: 1440px; margin: 0 auto; padding: 24px 40px 64px; }

  .topbar { display: flex; align-items: center; gap: 36px; background: var(--panel); border-radius: 999px; padding: 10px 10px 10px 22px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; letter-spacing: -0.01em; line-height: 1; }
  .nav { display: flex; gap: 2px; }
  .nav a { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 999px; font-weight: 500; color: var(--muted); }
  .nav a:hover { color: var(--midnight); background: var(--page); }
  .nav a.is-current { background: var(--midnight); color: #fff; }
  .topbar-actions { margin-left: auto; display: flex; gap: 8px; }

  .btn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .btn-primary { background: var(--sea-green); color: var(--midnight); }
  .btn-quiet { background: var(--page); color: var(--midnight); }
  .btn-white { background: var(--panel); color: var(--midnight); }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin: 44px 0 24px; }
  .page-head h1 { font-size: 30px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; }
  .page-head p { margin-top: 6px; color: var(--muted); }
  .head-actions { display: flex; gap: 8px; align-items: center; }

  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; }
  .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; }

  .panel { background: var(--panel); border-radius: 24px; padding: 26px 28px; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .panel h2 { font-size: 17px; font-weight: 600; }
  .panel .sub { font-size: 13.5px; color: var(--muted); }

  .chart { display: block; width: 100%; height: auto; }
  .chart .axis { font: 500 11.5px var(--font-sans); fill: var(--muted); }
  .chart .bar-label { font: 600 11px var(--font-sans); fill: var(--midnight); }
  .chart .point-label { font: 600 13px var(--font-sans); fill: var(--midnight); }

  /* Hero: the year of revenue won */
  .hero { padding: 32px 32px 20px; }
  .panel .hero-title { font-weight: 700; font-size: 58px; line-height: 1.05; letter-spacing: -0.01em; }
  .hero-note { margin-top: 10px; color: var(--muted); font-size: 15px; }
  .hero-note strong { color: var(--sea-green-ink); font-weight: 600; }
  .hero .chart { margin-top: 18px; }

  .figs { display: grid; gap: 24px; grid-template-rows: repeat(3, auto); }
  .fig { padding: 22px 26px; }
  .fig-label { font-size: 14px; font-weight: 500; color: var(--muted); }
  .fig-value { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; }
  .fig-sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .seg-bar { display: flex; gap: 3px; height: 12px; margin-top: 14px; }
  .seg-bar span { border-radius: 4px; }
  .meter { height: 12px; border-radius: 6px; background: var(--page); margin-top: 14px; overflow: hidden; }
  .meter span { display: block; height: 100%; border-radius: 6px; background: var(--sea-green); }
  .fig-late .fig-value { color: var(--raspberry-ink); }
  .late-list { margin-top: 12px; display: grid; gap: 6px; font-size: 13.5px; }
  .late-list li { display: flex; justify-content: space-between; gap: 12px; }
  .late-list .days { color: var(--raspberry-ink); font-weight: 600; white-space: nowrap; }
  .fig-link { display: inline-block; margin-top: 12px; font-size: 13.5px; font-weight: 600; color: var(--cerulean-ink); }

  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* Pipeline by stage */
  .stage-rows { display: grid; gap: 16px; }
  .stage-row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chip { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
  .count { font-size: 13px; color: var(--muted); margin-left: 8px; }
  .stage-value { font-weight: 600; font-size: 14.5px; }
  .stage-track { height: 10px; border-radius: 5px; background: var(--page); margin-top: 8px; position: relative; }
  .stage-track .v { position: absolute; inset: 0 auto 0 0; border-radius: 5px; }
  .stage-track .e { position: absolute; inset: 0 auto 0 0; border-radius: 5px; }
  .stage-exp { margin-top: 4px; font-size: 12.5px; color: var(--muted); text-align: right; }
  .stage-exp b { font-weight: 500; color: var(--midnight); }

  /* Funnel */
  .funnel { display: grid; gap: 6px; }
  .funnel-row { display: grid; grid-template-columns: 1fr 112px; align-items: center; gap: 12px; }
  .funnel-seg { justify-self: center; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 600; }
  .funnel-num { font-size: 13.5px; font-weight: 600; }
  .funnel-num small { display: block; font-family: var(--font-sans); font-weight: 400; font-size: 12px; color: var(--muted); }
  .funnel-foot { margin-top: 16px; display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; color: var(--muted); }
  .funnel-foot b { font-size: 20px; color: var(--midnight); }

  /* Follow-ups and activity */
  .tag { display: inline-flex; align-items: center; height: 26px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
  .tag-alert { background: #FDECEF; color: var(--raspberry-ink); }
  .todo { display: grid; }
  .todo li { display: grid; grid-template-columns: 18px 88px 1fr; gap: 14px; align-items: start; padding: 12px 0; }
  .todo li + li { box-shadow: 0 -1px 0 var(--page); }
  .todo .when { font-size: 13.5px; font-weight: 600; color: var(--muted); }
  .todo .when.overdue { color: var(--raspberry-ink); }
  .todo .when.today { color: var(--sea-green-ink); }
  .todo .what { font-weight: 500; }
  .on { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 13px; color: var(--muted); }
  .on a { color: var(--cerulean-ink); font-weight: 500; }
  .on .icon { width: 14px; height: 14px; }
  .todo-foot { margin-top: 8px; font-size: 13.5px; color: var(--muted); }

  .feed { display: grid; gap: 16px; }
  .feed li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
  .feed .badge { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--page); color: var(--midnight); }
  .feed .badge .icon { width: 16px; height: 16px; }
  .feed .text { font-size: 14px; line-height: 1.45; }
  .feed .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .feed .meta a { color: var(--cerulean-ink); font-weight: 500; }
  .feed .meta .at { margin-left: 10px; }

  /* Pipeline board */
  .board-figs { display: flex; gap: 28px; align-items: flex-end; margin-right: 8px; }
  .board-figs div { text-align: right; }
  .board-figs span { display: block; font-size: 13px; color: var(--muted); }
  .board-figs b { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .board { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .col-head { padding: 4px 4px 14px; }
  .col-head-top { display: flex; align-items: center; justify-content: space-between; }
  .col-total { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; margin-top: 10px; }
  .col-exp { font-size: 12.5px; color: var(--muted); }
  .col-exp b { font-weight: 500; color: var(--midnight); }
  .col-add { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--panel); }
  .col-add .icon { width: 14px; height: 14px; }
  .cards { display: grid; gap: 10px; }
  .card { background: var(--panel); border-radius: 14px; padding: 14px 14px 12px 16px; position: relative; }
  .card-name { font-weight: 600; font-size: 14.5px; line-height: 1.35; padding-right: 20px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-org { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .card-money { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; }
  .card-money b { font-size: 14.5px; font-weight: 600; }
  .card-money span { font-size: 12.5px; color: var(--muted); }
  .card-date { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .card-date .icon { width: 14px; height: 14px; }
  .late-badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--raspberry-ink); color: #fff; font-size: 12px; font-weight: 600; }
  .card-date.late { color: var(--raspberry-ink); font-weight: 500; }
  .card-menu { position: absolute; top: 10px; right: 8px; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
  .card-menu:hover { background: var(--page); }
  .card-menu .icon { width: 16px; height: 16px; }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#dashboard" aria-label="Accountable 대시보드">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="14" fill="#06D6A0"/><path d="M8.5 14.5l3.6 3.6 7.4-8" fill="none" stroke="#073B4C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Accountable
    </a>
    <nav class="nav" aria-label="주 메뉴" id="nav"></nav>
    <div class="topbar-actions"></div>
  </header>

  <main>
    <section data-view="dashboard" id="dashboard"></section>
    <section data-view="pipeline" id="pipeline" hidden></section>
  </main>
</div>

<script src="shared.js"></script>
<script>
  document.querySelector('.topbar-actions').innerHTML =
    `<button class="btn btn-primary" type="button">${icon('plus')}영업 기회 추가</button>`;

  document.getElementById('nav').innerHTML = NAV.map((n) =>
    `<a href="${navHref(n.key)}" data-nav="${n.key}">${n.ko}</a>`).join('');

  const chipStyle = (s) => `background:${s.chip};color:${s.onChip}`;
  const onLink = (x) => `<p class="on">${icon(x.kind === 'deal' ? 'briefcase' : 'users')}<a href="#">${x.on}</a>${x.sub ? `<span>${x.sub}</span>` : ''}</p>`;

  // Dashboard
  const maxStage = Math.max(...OPEN_STAGES.map((s) => s.value));
  const maxFunnel = FUNNEL[0].value;

  document.getElementById('dashboard').innerHTML = `
    <div class="page-head">
      <div>
        <h1>대시보드</h1>
        <p>${fmtDateDow(TODAY)}. 기한 지난 후속 조치 ${FIG.overdueCount}건과 지연된 영업 기회 ${FIG.lateCount}건이 있어요.</p>
      </div>
      <div class="head-actions">
        <button class="btn btn-white" type="button">${icon('note')}활동 기록</button>
      </div>
    </div>

    <div class="grid">
      <section class="panel hero span-8" aria-labelledby="hero-title">
        <h2 class="hero-title" id="hero-title">11월 수주 ${usd(FIG.wonMonth)}</h2>
        <p class="hero-note">지난달보다 <strong>${usd(FIG.wonChange)} (${pct(FIG.wonChangePct)})</strong> 늘었어요. 최근 12개월 수주는 모두 ${usd(FIG.wonYear)}예요.</p>
        ${lineChart({ width: 820, height: 470 })}
      </section>

      <div class="figs span-4">
        <section class="panel fig">
          <p class="fig-label">진행 중 파이프라인</p>
          <p class="fig-value">${usd(FIG.openValue)}</p>
          <p class="fig-sub">영업 기회 ${FIG.openCount}건</p>
          <div class="seg-bar" role="img" aria-label="${OPEN_STAGES.map((s) => `${s.ko} ${usd(s.value)}`).join(', ')}">
            ${OPEN_STAGES.map((s) => `<span style="flex:${s.value};background:${s.fill}"></span>`).join('')}
          </div>
        </section>
        <section class="panel fig">
          <p class="fig-label">예상 매출</p>
          <p class="fig-value">${usd(FIG.expected)}</p>
          <p class="fig-sub">진행 중 파이프라인의 ${pct(FIG.expectedShare)}</p>
          <div class="meter" role="img" aria-label="파이프라인의 ${pct(FIG.expectedShare)}"><span style="width:${FIG.expectedShare}%"></span></div>
        </section>
        <section class="panel fig fig-late">
          <p class="fig-label">지연된 영업 기회</p>
          <p class="fig-value">${FIG.lateCount}건</p>
          <p class="fig-sub">모두 ${usd(FIG.lateValue)}</p>
          <ul class="late-list">
            ${lateDeals.map((d) => `<li><a href="#">${d.name}</a><span class="days">${daysLate(d)}일 지남</span></li>`).join('')}
          </ul>
          <a class="fig-link" href="#">영업 기회 표에서 보기</a>
        </section>
      </div>

      <section class="panel span-4">
        <div class="panel-head">
          <h2>월별 수주·실주 건수</h2>
          <div class="legend"><span><i style="background:#06D6A0"></i>수주</span><span><i style="background:#F78C6B"></i>실주</span></div>
        </div>
        ${barChart({ width: 400, height: 250 })}
      </section>

      <section class="panel span-4">
        <div class="panel-head"><h2>단계별 파이프라인</h2><a class="sub" href="#pipeline">보드 열기</a></div>
        <div class="stage-rows">
          ${OPEN_STAGES.map((s) => `
            <a class="stage-row" href="#pipeline">
              <div class="stage-row-top">
                <span><span class="chip" style="${chipStyle(s)}">${s.ko}</span><span class="count">${s.count}건</span></span>
                <span class="stage-value">${usd(s.value)}</span>
              </div>
              <div class="stage-track">
                <span class="v" style="width:${(s.value / maxStage) * 100}%;background:${s.fill};opacity:.45"></span>
                <span class="e" style="width:${(s.expected / maxStage) * 100}%;background:${s.fill}"></span>
              </div>
              <p class="stage-exp">예상 <b>${usd(s.expected)}</b></p>
            </a>`).join('')}
        </div>
      </section>

      <section class="panel span-4">
        <div class="panel-head"><h2>영업 퍼널</h2><span class="sub">최근 12개월</span></div>
        <div class="funnel">
          ${FUNNEL.map((f) => {
            const s = STAGE[f.stage];
            const w = Math.max(30, (f.value / maxFunnel) * 100);
            return `<div class="funnel-row">
              <div class="funnel-seg" style="width:${w}%;${chipStyle(s)}">${s.ko}</div>
              <p class="funnel-num">${usd(f.value)}<small>${f.n}건, 신규의 ${pct((f.value / maxFunnel) * 100)}</small></p>
            </div>`;
          }).join('')}
        </div>
        <p class="funnel-foot">신규 → 수주 전환율 (금액 기준)<b>${pct((FUNNEL[4].value / maxFunnel) * 100)}</b></p>
      </section>

      <section class="panel span-7">
        <div class="panel-head"><h2>후속 조치</h2><span class="tag tag-alert">기한 지남 ${FIG.overdueCount}건</span></div>
        <ul class="todo">
          ${FOLLOWUPS.map((f, i) => {
            const st = followUpState(f);
            return `<li>
              <input class="check" type="checkbox" id="fu${i}" aria-label="${f.text} 완료">
              <span class="when ${st.kind}">${st.label}</span>
              <div><label class="what" for="fu${i}">${f.text}</label>${onLink(f)}</div>
            </li>`;
          }).join('')}
        </ul>
        <p class="todo-foot">그 이후 예정된 후속 조치 ${FOLLOWUPS_LATER}건</p>
      </section>

      <section class="panel span-5">
        <div class="panel-head"><h2>최근 활동</h2></div>
        <ul class="feed">
          ${ACTIVITY.slice(0, 7).map((a) => `<li>
            <span class="badge" title="${KIND_LABEL[a.kind]}">${icon(a.kind)}</span>
            <div>
              <p class="text">${a.text}</p>
              <p class="meta"><span class="sr-only">${KIND_LABEL[a.kind]}, </span><a href="#">${a.on}</a>${a.sub ? `, ${a.sub}` : ''}<span class="at">${fmtWhen(a.at)}</span></p>
            </div>
          </li>`).join('')}
        </ul>
      </section>
    </div>`;

  // Pipeline
  const card = (d) => `
    <article class="card" tabindex="0" aria-label="${d.name}, ${usd(d.value)}">
      <h3 class="card-name">${d.name}</h3>
      <p class="card-org">${d.org}</p>
      <button class="card-menu" type="button" aria-label="${d.name} 메뉴">${icon('more')}</button>
      <div class="card-money"><b>${usd(d.value)}</b><span>${d.prob}%</span></div>
      ${isLate(d)
        ? `<p class="card-date late"><span class="late-badge">지연 ${daysLate(d)}일</span>${fmtDate(d.close)}</p>`
        : `<p class="card-date">${icon('calendar')}${fmtDate(d.close)}</p>`}
    </article>`;

  document.getElementById('pipeline').innerHTML = `
    <div class="page-head">
      <div>
        <h1>파이프라인</h1>
        <p>진행 중인 영업 기회 ${FIG.openCount}건. 카드를 끌어 단계를 바꾸거나 순서를 정하세요.</p>
      </div>
      <div class="head-actions">
        <div class="board-figs">
          <div><span>진행 중</span><b>${usd(FIG.openValue)}</b></div>
          <div><span>예상 매출</span><b>${usd(FIG.expected)}</b></div>
        </div>
      </div>
    </div>
    <div class="board">
      ${BY_STAGE.map((s) => `
        <section class="col" aria-label="${s.ko} 단계">
          <div class="col-head">
            <div class="col-head-top">
              <span><span class="chip" style="${chipStyle(s)}">${s.ko}</span><span class="count">${s.count}건</span></span>
              <button class="col-add" type="button" aria-label="${s.ko} 단계에 영업 기회 추가">${icon('plus')}추가</button>
            </div>
            <p class="col-total">${usd(s.value)}</p>
            <p class="col-exp">${s.open ? `예상 <b>${usd(s.expected)}</b>` : '최근 30일'}</p>
          </div>
          <div class="cards">${s.deals.map(card).join('')}</div>
        </section>`).join('')}
    </div>`;

  setupViews();
</script>
</body>
</html>
