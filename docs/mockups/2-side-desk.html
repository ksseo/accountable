<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accountable mockup 2: Side desk</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  /* Mockup 2, Side desk: a Midnight side bar, a dense work area, and today's to-do list as a standing column. */
  body { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }

  .side { background: var(--midnight); color: var(--sea-mist); }
  .side-inner { position: sticky; top: 0; height: 100vh; padding: 26px 16px; display: flex; flex-direction: column; gap: 28px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px; font-weight: 700; font-size: 22px; letter-spacing: -0.01em; line-height: 1; color: #fff; }
  .nav { display: grid; gap: 4px; }
  .nav a { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; border-radius: 12px; font-weight: 500; }
  .nav a:hover { background: rgba(205, 216, 219, 0.1); }
  .nav a.is-current { background: var(--sea-green); color: var(--midnight); font-weight: 600; }
  .side-foot { margin-top: auto; padding: 16px 14px; border-radius: 14px; background: rgba(205, 216, 219, 0.08); font-size: 13px; }
  .side-foot b { display: block; margin-top: 2px; font-size: 15px; color: #fff; font-weight: 600; }

  .main { padding: 28px 32px 56px; min-width: 0; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
  .page-head h1 { font-size: 26px; font-weight: 700; line-height: 1.2; }
  .page-head p { margin-top: 4px; color: var(--muted); font-size: 14.5px; }
  .head-actions { display: flex; align-items: center; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 12px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .btn-primary { background: var(--sea-green); color: var(--midnight); }
  .btn-white { background: var(--panel); color: var(--midnight); }

  .desk { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
  .stack { display: grid; gap: 20px; min-width: 0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

  .panel { background: var(--panel); border-radius: 18px; padding: 20px 22px; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .panel-head h2 { font-size: 16px; font-weight: 600; }
  .panel-head .sub { font-size: 13px; color: var(--muted); }
  .panel-head .sub b { font-weight: 600; color: var(--midnight); }

  .chart { display: block; width: 100%; height: auto; }
  .chart .axis { font: 500 11px var(--font-sans); fill: var(--muted); }
  .chart .bar-label { font: 600 10.5px var(--font-sans); fill: var(--midnight); }
  .chart .point-label { font: 600 12.5px var(--font-sans); fill: var(--midnight); }

  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .tile { background: var(--panel); border-radius: 18px; padding: 16px 18px 18px; }
  .tile-label { font-size: 13.5px; color: var(--muted); font-weight: 500; }
  .tile-value { font-size: 25px; font-weight: 600; letter-spacing: -0.03em; margin-top: 6px; }
  .tile-sub { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .pill-up { background: #E1FAF3; color: var(--sea-green-ink); }
  .pill-alert { background: #FDECEF; color: var(--raspberry-ink); }
  .tile-late .tile-value { color: var(--raspberry-ink); }

  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* Pipeline by stage, as columns */
  .stage-cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: end; height: 190px; }
  .stage-col { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .stage-col .val { font-size: 12.5px; font-weight: 600; }
  .stage-bar { width: 100%; max-width: 64px; border-radius: 8px 8px 4px 4px; position: relative; overflow: hidden; }
  .stage-bar .e { position: absolute; left: 0; right: 0; bottom: 0; }
  .stage-foot { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 10px; text-align: center; }
  .stage-foot .chip { margin: 0 auto; }
  .stage-foot p { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stage-foot p b { font-weight: 500; color: var(--midnight); }
  .chip { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 6px; font-size: 12px; font-weight: 700; }

  /* Funnel, as steps */
  .steps { display: grid; gap: 8px; }
  .step { display: grid; grid-template-columns: minmax(0, 1fr) 128px 110px; align-items: center; gap: 14px; }
  .step-bar { height: 36px; border-radius: 8px; display: flex; align-items: center; padding: 0 12px; font-size: 13px; font-weight: 700; }
  .step .v { font-size: 14px; font-weight: 600; text-align: right; }
  .step .n { font-size: 12.5px; color: var(--muted); }
  .steps-foot { display: flex; justify-content: space-between; margin-top: 14px; font-size: 13.5px; color: var(--muted); }
  .steps-foot b { color: var(--midnight); font-size: 16px; }

  /* Right column: today's work */
  .rail { display: grid; gap: 20px; }
  .group + .group { margin-top: 16px; }
  .group-head { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .group-head.overdue { color: var(--raspberry-ink); }
  .group-head.today { color: var(--sea-green-ink); }
  .task { display: grid; grid-template-columns: 18px 1fr; gap: 12px; padding: 10px 12px; border-radius: 12px; }
  .task + .task { margin-top: 4px; }
  .task.overdue { background: #FDECEF; }
  .task.today { background: #E1FAF3; }
  .task.upcoming { background: var(--page); }
  .task label { font-weight: 500; font-size: 14px; line-height: 1.4; display: block; }
  .task .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 3px; font-size: 12.5px; color: var(--muted); }
  .task .meta a { color: var(--cerulean-ink); font-weight: 500; }
  .task .meta .late { color: var(--raspberry-ink); font-weight: 600; }
  .rail-foot { margin-top: 12px; font-size: 13px; color: var(--muted); }

  .feed { display: grid; gap: 14px; }
  .feed li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; }
  .feed .badge { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--page); }
  .feed .badge .icon { width: 15px; height: 15px; }
  .feed .text { font-size: 13.5px; line-height: 1.45; }
  .feed .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .feed .meta a { color: var(--cerulean-ink); font-weight: 500; }

  /* Pipeline board */
  .board-figs { display: flex; gap: 8px; }
  .board-fig { background: var(--panel); border-radius: 12px; padding: 6px 14px; text-align: right; }
  .board-fig span { display: block; font-size: 12px; color: var(--muted); }
  .board-fig b { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
  .board { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; align-items: start; }
  .lane { background: var(--panel); border-radius: 16px; overflow: hidden; }
  .lane-head { padding: 12px 14px 12px; }
  .lane-head-top { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 15px; }
  .lane-head-top span { font-size: 13px; font-weight: 600; }
  .lane-total { font-size: 17px; font-weight: 600; margin-top: 6px; letter-spacing: -0.02em; }
  .lane-exp { font-size: 12px; font-weight: 500; }
  .lane-exp b { font-weight: 600; }
  .lane-body { padding: 10px; display: grid; gap: 8px; }
  .card { background: var(--page); border-radius: 10px; padding: 11px 12px; position: relative; }
  .card.is-late { background: #FDECEF; }
  .card-name { font-size: 13.5px; font-weight: 600; line-height: 1.35; padding-right: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-org { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .card-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 9px; }
  .card-row b { font-size: 13.5px; font-weight: 600; }
  .card-row span { font-size: 12px; color: var(--muted); }
  .card-date { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .card-date.late { color: var(--raspberry-ink); font-weight: 600; }
  .card-menu { position: absolute; top: 8px; right: 6px; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
  .card-menu .icon { width: 15px; height: 15px; }
  .lane-add { display: flex; align-items: center; justify-content: center; gap: 6px; height: 36px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .lane-add:hover { background: var(--page); color: var(--midnight); }
  .lane-add .icon { width: 15px; height: 15px; }
</style>
</head>
<body>
<aside class="side"><div class="side-inner">
  <a class="brand" href="#dashboard" aria-label="Accountable 대시보드">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="14" width="6" height="11" rx="2" fill="#06D6A0"/><rect x="10" y="8" width="6" height="17" rx="2" fill="#FFC145"/><rect x="19" y="1" width="6" height="24" rx="2" fill="#F78C6B"/></svg>
    Accountable
  </a>
  <nav class="nav" aria-label="주 메뉴" id="nav"></nav>
  <div class="side-foot">오늘<b id="today"></b></div>
</div>
</aside>

<main class="main">
  <section data-view="dashboard" id="dashboard"></section>
  <section data-view="pipeline" id="pipeline" hidden></section>
</main>

<script src="shared.js"></script>
<script>
  document.getElementById('nav').innerHTML = NAV.map((n) =>
    `<a href="${navHref(n.key)}" data-nav="${n.key}">${icon(n.icon)}${n.ko}</a>`).join('');
  document.getElementById('today').textContent = fmtDateDow(TODAY);

  const chipStyle = (s) => `background:${s.chip};color:${s.onChip}`;
  const actions = `
    <div class="head-actions">
      <button class="btn btn-white" type="button">${icon('note')}활동 기록</button>
      <button class="btn btn-primary" type="button">${icon('plus')}영업 기회 추가</button>
    </div>`;

  // Dashboard
  const maxStage = Math.max(...OPEN_STAGES.map((s) => s.value));
  const maxFunnel = FUNNEL[0].value;
  const groups = [
    { kind: 'overdue', title: '기한 지남' },
    { kind: 'today', title: '오늘' },
    { kind: 'upcoming', title: '다음 14일' },
  ];

  document.getElementById('dashboard').innerHTML = `
    <div class="page-head">
      <div>
        <h1>대시보드</h1>
        <p>기한 지난 후속 조치 ${FIG.overdueCount}건과 지연된 영업 기회 ${FIG.lateCount}건을 먼저 보세요.</p>
      </div>
      ${actions}
    </div>

    <div class="desk">
      <div class="stack">
        <div class="tiles">
          <a class="tile" href="#pipeline">
            <p class="tile-label">진행 중 파이프라인</p>
            <p class="tile-value">${usd(FIG.openValue)}</p>
            <p class="tile-sub">영업 기회 ${FIG.openCount}건</p>
          </a>
          <div class="tile">
            <p class="tile-label">예상 매출</p>
            <p class="tile-value">${usd(FIG.expected)}</p>
            <p class="tile-sub">파이프라인의 ${pct(FIG.expectedShare)}</p>
          </div>
          <div class="tile">
            <p class="tile-label">이번 달 수주</p>
            <p class="tile-value">${usd(FIG.wonMonth)}</p>
            <p class="tile-sub"><span class="pill pill-up">+${pct(FIG.wonChangePct)}</span>지난달 대비</p>
          </div>
          <a class="tile tile-late" href="#">
            <p class="tile-label">지연된 영업 기회</p>
            <p class="tile-value">${FIG.lateCount}건</p>
            <p class="tile-sub"><span class="pill pill-alert">${usd(FIG.lateValue)}</span></p>
          </a>
        </div>

        <section class="panel">
          <div class="panel-head"><h2>월별 수주 금액</h2><span class="sub">최근 12개월 <b>${usd(FIG.wonYear)}</b></span></div>
          ${lineChart({ width: 760, height: 264, pad: { t: 26, r: 16, b: 46, l: 50 } })}
        </section>

        <div class="pair">
          <section class="panel">
            <div class="panel-head">
              <h2>월별 수주·실주 건수</h2>
              <div class="legend"><span><i style="background:#06D6A0"></i>수주</span><span><i style="background:#F78C6B"></i>실주</span></div>
            </div>
            ${barChart({ width: 340, height: 264, pad: { t: 22, r: 4, b: 46, l: 4 } })}
          </section>

          <section class="panel">
            <div class="panel-head"><h2>단계별 파이프라인</h2><a class="sub" href="#pipeline">보드 열기</a></div>
            <div class="stage-cols" role="img" aria-label="${OPEN_STAGES.map((s) => `${s.ko} ${usd(s.value)}, 예상 ${usd(s.expected)}`).join('; ')}">
              ${OPEN_STAGES.map((s) => `
                <div class="stage-col">
                  <span class="val">${usdShort(s.value)}</span>
                  <div class="stage-bar" style="height:${(s.value / maxStage) * 150}px;background:${s.fill}66">
                    <span class="e" style="height:${s.prob}%;background:${s.fill}"></span>
                  </div>
                </div>`).join('')}
            </div>
            <div class="stage-foot">
              ${OPEN_STAGES.map((s) => `<div><span class="chip" style="${chipStyle(s)}">${s.ko}</span><p>예상 <b>${usdShort(s.expected)}</b></p></div>`).join('')}
            </div>
          </section>
        </div>

        <section class="panel">
          <div class="panel-head"><h2>영업 퍼널</h2><span class="sub">최근 12개월과 진행 중인 영업 기회</span></div>
          <div class="steps">
            ${FUNNEL.map((f) => {
              const s = STAGE[f.stage];
              return `<div class="step">
                <div><div class="step-bar" style="width:${Math.max(18, (f.value / maxFunnel) * 100)}%;${chipStyle(s)}">${s.ko}</div></div>
                <span class="v">${usd(f.value)}</span>
                <span class="n">${f.n}건, 신규의 ${pct((f.value / maxFunnel) * 100)}</span>
              </div>`;
            }).join('')}
          </div>
          <p class="steps-foot">신규 → 수주 전환율 (금액 기준)<b>${pct((FUNNEL[4].value / maxFunnel) * 100)}</b></p>
        </section>
      </div>

      <div class="rail">
        <section class="panel">
          <div class="panel-head"><h2>오늘 할 일</h2><span class="sub">후속 조치 ${FOLLOWUPS.length + FOLLOWUPS_LATER}건</span></div>
          ${groups.map((g) => {
            const items = FOLLOWUPS.filter((f) => followUpState(f).kind === g.kind);
            return `<div class="group">
              <p class="group-head ${g.kind}"><span>${g.title}</span><span>${items.length}건</span></p>
              ${items.map((f, i) => {
                const st = followUpState(f);
                const id = `${g.kind}${i}`;
                return `<div class="task ${g.kind}">
                  <input class="check" type="checkbox" id="${id}">
                  <div>
                    <label for="${id}">${f.text}</label>
                    <p class="meta">${g.kind === 'overdue' ? `<span class="late">${st.label}</span>` : g.kind === 'upcoming' ? `<span>${st.label}</span>` : ''}<a href="#">${f.on}</a>${f.sub ? `<span>${f.sub}</span>` : ''}</p>
                  </div>
                </div>`;
              }).join('')}
            </div>`;
          }).join('')}
          <p class="rail-foot">그 이후 ${FOLLOWUPS_LATER}건 더 있어요.</p>
        </section>

        <section class="panel">
          <div class="panel-head"><h2>최근 활동</h2></div>
          <ul class="feed">
            ${ACTIVITY.slice(0, 6).map((a) => `<li>
              <span class="badge" title="${KIND_LABEL[a.kind]}">${icon(a.kind)}</span>
              <div>
                <p class="text">${a.text}</p>
                <p class="meta"><span class="sr-only">${KIND_LABEL[a.kind]}, </span><a href="#">${a.on}</a>, ${fmtWhen(a.at)}</p>
              </div>
            </li>`).join('')}
          </ul>
        </section>
      </div>
    </div>`;

  // Pipeline
  const card = (d) => `
    <article class="card ${isLate(d) ? 'is-late' : ''}" tabindex="0" aria-label="${d.name}, ${usd(d.value)}">
      <h3 class="card-name">${d.name}</h3>
      <p class="card-org">${d.org}</p>
      <button class="card-menu" type="button" aria-label="${d.name} 메뉴">${icon('more')}</button>
      <div class="card-row"><b>${usd(d.value)}</b><span>${d.prob}%</span></div>
      ${isLate(d)
        ? `<p class="card-date late">지연 ${daysLate(d)}일, ${fmtDate(d.close)}</p>`
        : `<p class="card-date">마감 ${fmtDate(d.close)}</p>`}
    </article>`;

  document.getElementById('pipeline').innerHTML = `
    <div class="page-head">
      <div>
        <h1>파이프라인</h1>
        <p>진행 중인 영업 기회 ${FIG.openCount}건. 카드를 끌어 단계를 바꾸세요.</p>
      </div>
      <div class="head-actions">
        <div class="board-figs">
          <div class="board-fig"><span>진행 중</span><b>${usd(FIG.openValue)}</b></div>
          <div class="board-fig"><span>예상 매출</span><b>${usd(FIG.expected)}</b></div>
        </div>
        <button class="btn btn-primary" type="button">${icon('plus')}영업 기회 추가</button>
      </div>
    </div>
    <div class="board">
      ${BY_STAGE.map((s) => `
        <section class="lane" aria-label="${s.ko} 단계">
          <div class="lane-head" style="${chipStyle(s)}">
            <p class="lane-head-top">${s.ko}<span>${s.count}</span></p>
            <p class="lane-total">${usd(s.value)}</p>
            <p class="lane-exp">${s.open ? `예상 <b>${usd(s.expected)}</b>` : '최근 30일'}</p>
          </div>
          <div class="lane-body">
            ${s.deals.map(card).join('')}
            <button class="lane-add" type="button" aria-label="${s.ko} 단계에 영업 기회 추가">${icon('plus')}추가</button>
          </div>
        </section>`).join('')}
    </div>`;

  setupViews();
</script>
</body>
</html>
