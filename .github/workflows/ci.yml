name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so that gitleaks sees every commit.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $archive" | sha256sum --check
          sudo tar -xzf "$archive" -C /usr/local/bin gitleaks

      - name: Look for secrets
        run: gitleaks git . --no-banner --redact --verbose

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: astral-sh/setup-uv@v10.4.0

      - run: npm ci

      - run: npm run check:quick
